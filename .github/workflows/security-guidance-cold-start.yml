name: Security Guidance Cold Start PoC

on:
  issue_comment:
    types: [created]

jobs:
  cold-start:
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'marcelhacks' &&
      contains(github.event.comment.body, '@claude-cold-poc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prove fresh hosted-runner state
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "initial_commit=$(git rev-parse HEAD)"
          test ! -e "$HOME/.claude/security"
          test ! -e "$HOME/.claude/security/agent-sdk-venv"
          echo "COLD_STATE_CONFIRMED"

      - name: Run pinned published Claude Code Action
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: cold-start-invalid-key
          plugin_marketplaces: ${{ contains(github.event.comment.body, '@claude-cold-control') && 'https://github.com/marcelhacks/anthropic-sg-safe-path-control-20260724.git' || 'https://github.com/anthropics/claude-plugins-official.git' }}
          plugins: ${{ contains(github.event.comment.body, '@claude-cold-control') && 'security-guidance@sg-safe-path-control' || 'security-guidance@claude-plugins-official' }}
          claude_args: >-
            --max-turns 1
            --tools ""
            --debug-file /tmp/claude-debug.log

      - name: Verify target-side cold-start execution
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_BASELINE: ${{ contains(github.event.comment.body, '@claude-cold-baseline') }}
          EXPECT_CONTROL: ${{ contains(github.event.comment.body, '@claude-cold-control') }}
        run: |
          set -euo pipefail
          echo "action_outcome=${{ steps.claude.outcome }}"
          echo "checked_out_commit=$(git rev-parse HEAD)"
          echo "checked_out_branch=$(git branch --show-current)"

          expected="[security-guidance cold-start PoC] PR-controlled \`venv.py\` executed during SessionStart in run $GITHUB_RUN_ID."
          if [[ "$EXPECT_BASELINE" == "true" ]]; then
            test ! -e /tmp/security-guidance-cold-start.json
            comment_id="$(
              gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}/comments" \
                --jq ".[] | select(.body == \"$expected\") | .id" |
                tail -1
            )"
            test -z "$comment_id"
            echo "HOSTED_BASELINE_NO_EXECUTION_CONFIRMED"
            exit 0
          fi

          if [[ "$EXPECT_CONTROL" == "true" ]]; then
            test ! -e /tmp/security-guidance-cold-start.json
            comment_id="$(
              gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}/comments" \
                --jq ".[] | select(.body == \"$expected\") | .id" |
                tail -1
            )"
            test -z "$comment_id"
            control_file="$HOME/.claude/plugins/cache/sg-safe-path-control/security-guidance/2.0.6/hooks/ensure_agent_sdk.py"
            test -f "$control_file"
            rg -n '\[sys\.executable, "-P", "-m", "venv"' "$control_file"
            echo "HOSTED_SAFE_PATH_CONTROL_NO_EXECUTION_CONFIRMED"
            exit 0
          fi

          for attempt in {1..60}; do
            test -f /tmp/security-guidance-cold-start.json && break
            sleep 0.25
          done
          test -f /tmp/security-guidance-cold-start.json
          jq '{
            event,
            time_ns,
            pid,
            ppid,
            uid,
            cwd,
            executable,
            argv,
            direct_environment_sha256,
            github_comment
          }' /tmp/security-guidance-cold-start.json

          comment_id=""
          for attempt in {1..60}; do
            comment_id="$(
              gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}/comments" \
                --jq ".[] | select(.body == \"$expected\") | .id" |
                tail -1
            )"
            test -n "$comment_id" && break
            sleep 0.25
          done
          test -n "$comment_id"
          echo "authenticated_comment_id=$comment_id"

          if test -x "$HOME/.claude/security/agent-sdk-venv/bin/python"; then
            echo "SDK_VENV_CREATED_BEFORE_MODEL_ABORT"
          else
            echo "SDK_VENV_INTERRUPTED_BY_EXPECTED_MODEL_ABORT"
          fi
          echo "HOSTED_COLD_START_EXECUTION_CONFIRMED"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-guidance-cold-start-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/security-guidance-cold-start.json
            /tmp/claude-debug.log
          retention-days: 7
